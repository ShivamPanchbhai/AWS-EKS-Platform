############################################################
# EXTERNAL SECRET: GRAFANA ADMIN CREDENTIALS
# Tells ESO which SSM parameters to fetch and what
# Kubernetes Secret to create from them
############################################################
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  # How often ESO syncs the secret from SSM
  refreshInterval: 1h

  secretStoreRef:
    # References the same SecretStore used for the SMTP secret
    name: aws-ssm-store
    kind: SecretStore

  target:
    # Name of the Kubernetes Secret ESO will create
    name: grafana-admin-secret
    creationPolicy: Owner

  data:
    # Username isn't sensitive, "admin" is Grafana's own default,
    # stored in SSM anyway so both keys come from one place
    - secretKey: admin-user
      remoteRef:
        key: /monitoring/grafana-admin-user

    # Actual admin password, fetched as a SecureString
    - secretKey: admin-password
      remoteRef:
        key: /monitoring/grafana-admin-password